# ===============================
# DATABASE
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pos_lite_myanmar?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Yangon}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}
server.address=0.0.0.0

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:local-development-secret-change-before-production-2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# CORS (for React Native)
# ===============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4173,http://localhost:19000,http://localhost:8081,http://10.0.2.2:19000,exp://localhost:19000,exp://10.0.2.2:19000}

# ===============================
# SUBSCRIPTION / SUPER ADMIN
# Change these values through environment variables in production.
# ===============================
subscription.default-trial-days=${DEFAULT_TRIAL_DAYS:30}
super-admin.username=${SUPER_ADMIN_USERNAME:superadmin}
super-admin.password=${SUPER_ADMIN_PASSWORD:change-me-before-production}

# Render Free has an ephemeral filesystem. Use external object storage before
# relying on payment screenshots in production.
app.upload-dir=${UPLOAD_DIR:uploads}
